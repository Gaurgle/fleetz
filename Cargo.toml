[package]
name = "fleetz"
version = "0.5.1"
edition = "2024"
description = "Multi-repo dashboard TUI: see what changed across your repos"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
shellexpand = "3"
toml_edit = "0.25.13"
