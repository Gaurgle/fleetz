# The same gates release.yml applies before a tag, run on every branch push
# that touches more than prose, so a ticket branch is green before it merges.
name: ci

on:
  push:
    # Naming branches keeps tag pushes out: release.yml runs the gates there.
    branches: ['**']
    # Skipped only when every changed file matches. docs.yml checks these.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  # Fork pull requests get no push run in this repository, so run them here.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

permissions:
  contents: read

jobs:
  check:
    # A same-repository pull request is already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit, not the moving `stable` branch. The ref used to
      # name the toolchain, so it is now stated in `toolchain`.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
