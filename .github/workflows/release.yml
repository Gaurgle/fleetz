# Cut a GitHub release whenever a v* tag is pushed. The tag is the only manual
# step: bump Cargo.toml, commit, `git tag vX.Y.Z`, push the tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the previous tag and the commits between

      # The version in Cargo.toml is what `cargo install` reports, so a tag
      # that disagrees with it is a mistake, not a release.
      - name: Check tag matches Cargo.toml
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)"/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          [ "$crate" = "$tag" ] || { echo "tag v$tag but Cargo.toml says $crate"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Never ship a red build.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
